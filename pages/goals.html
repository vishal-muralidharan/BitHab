<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="../assets/js/theme-preload-inline.js"></script>
  <title>BitHab</title>
  <link rel="icon" href="../assets/images/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/images/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:400,500&display=swap" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/dashboard.css" />
  <link rel="stylesheet" href="../assets/css/management.css" />
</head>
<body>
  <!-- Mobile/Tablet Topbar -->
  <div class="mobile-topbar">
    <a href="../index.html" class="logo-link">
      <h1 class="logo">
        <img src="../assets/images/logo-transparent-light.png" alt="BitHab Logo" class="logo-light">
        <img src="../assets/images/logo-transparent-dark.png" alt="BitHab Logo" class="logo-dark">
      </h1>
    </a>
    <button id="mobile-theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark/light mode">
      <i class="fas fa-moon"></i>
    </button>
  </div>

  <header class="header">
    <a href="../index.html" class="logo-link">
      <h1 class="logo">
        <img src="../assets/images/logo-transparent-light.png" alt="BitHab Logo" class="logo-light">
        <img src="../assets/images/logo-transparent-dark.png" alt="BitHab Logo" class="logo-dark">
      </h1>
    </a>
    <nav class="header-nav">
      <a href="activities.html" class="nav-item">Activities</a>
      <a href="goals.html" class="nav-item active">Goals</a>
      <a href="notes.html" class="nav-item">Notes</a>
      <a href="reminders.html" class="nav-item">Reminders</a>
      <a href="focus.html" class="nav-item">Focus</a>
      <div class="more-dropdown">
        <button class="more-btn nav-item" aria-label="More options">More</button>
        <div class="more-dropdown-content">
          <a href="themes.html">Themes</a>
        </div>
      </div>
    </nav>
    <div class="header-actions">
      <button id="theme-toggle" class="header-btn theme-toggle-btn" aria-label="Toggle dark/light mode">
        <i class="fas fa-moon"></i>
      </button>
      <button id="logout-btn" class="header-btn" aria-label="Logout">Logout</button>
    </div>
  </header>
  <div class="page-container">
    <main class="content">
        <div class="management-column">
            <div class="page-header">
                <h1>Goals</h1>
                <p class="page-subtitle">Set, track, and complete your goals</p>
            </div>
      <div class="add-item-form">
        <input type="text" id="add-goal-input" class="add-input" placeholder="Add new goal...">
        <button id="add-goal-btn" class="add-btn" aria-label="Add goal">
          <i class="fas fa-plus icon-only" aria-hidden="true"></i>
        </button>
            </div>
            <ul id="goal-list" class="goal-list"></ul>
        </div>
    </main>
  </div>
  <div id="confirmation-modal" class="modal hidden">
    <div class="modal-content">
        <p id="confirmation-message">Are you sure?</p>
        <div class="confirmation-buttons">
            <button id="confirm-yes" class="btn-confirm">Yes</button>
            <button id="confirm-no" class="btn-cancel">No</button>
        </div>
    </div>
  </div>
  
  <!-- Edit Goal Modal -->
  <div id="edit-goal-modal" class="modal hidden">
    <div class="modal-content">
        <h3>Edit Goal</h3>
        <div class="edit-form">
            <label for="edit-goal-name">Goal Name:</label>
            <input type="text" id="edit-goal-name" placeholder="Goal name">
            <div class="modal-buttons">
                <button id="save-goal-edit" class="btn-confirm">Save</button>
                <button id="cancel-goal-edit" class="btn-cancel">Cancel</button>
            </div>
        </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="../config/firebase-config.js"></script>
  <script src="../assets/js/error-handler.js"></script>
  <script src="../assets/js/auth-manager.js"></script>
  <script src="../assets/js/database-migration.js"></script>
  <script src="../assets/js/database-service.js"></script>
  <script src="../assets/js/data-sync.js"></script>
  <script src="../assets/js/unified-theme-system.js"></script>
  <script src="../assets/js/mobile-nav.js"></script>
  <script src="../assets/js/goals.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Mobile theme toggle
        const mobileThemeToggle = document.getElementById('mobile-theme-toggle');
        if (mobileThemeToggle && window.themeSystem) {
            mobileThemeToggle.addEventListener('click', () => {
                window.themeSystem.toggleDarkMode();
            });
        }
    });
  </script>
  
  <!-- Bottom Navigation for Mobile/Tablet -->
  <nav class="bottom-nav">
    <div class="bottom-nav-content">
      <a href="../index.html" class="bottom-nav-item">
        <i class="fas fa-home bottom-nav-icon"></i>
        <span class="bottom-nav-label">Home</span>
      </a>
      <a href="activities.html" class="bottom-nav-item">
        <i class="fas fa-chart-line bottom-nav-icon"></i>
        <span class="bottom-nav-label">Activities</span>
      </a>
      <a href="goals.html" class="bottom-nav-item active">
        <i class="fas fa-bullseye bottom-nav-icon"></i>
        <span class="bottom-nav-label">Goals</span>
      </a>
      <a href="reminders.html" class="bottom-nav-item">
        <i class="fas fa-bell bottom-nav-icon"></i>
        <span class="bottom-nav-label">Reminders</span>
      </a>
      <div class="bottom-nav-item more-bottom-nav">
        <i class="fas fa-ellipsis-h bottom-nav-icon"></i>
        <span class="bottom-nav-label">More</span>
        <div class="more-bottom-dropdown">
          <a href="notes.html" class="more-dropdown-item">
            <i class="fas fa-sticky-note"></i>
            <span>Notes</span>
          </a>
          <a href="focus.html" class="more-dropdown-item">
            <i class="fas fa-clock"></i>
            <span>Focus</span>
          </a>
          <a href="themes.html" class="more-dropdown-item">
            <i class="fas fa-palette"></i>
            <span>Themes</span>
          </a>
          <button class="more-dropdown-item logout-item" id="logout-bottom-nav">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
          </button>
        </div>
      </div>
    </div>
  </nav>
</body>
</html>
