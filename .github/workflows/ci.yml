name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        env:
          CI: "true"
        run: npm run lint
      - name: Test
        env:
          CI: "true"
        run: npm run test
      - name: Build
        env:
          CI: "true"
        run: npm run build
